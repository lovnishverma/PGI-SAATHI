name: PGI Saathi CI Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Test, & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # 1. Frontend Checks
      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Frontend Code Quality (oxlint)
        run: cd frontend && npm run lint

      - name: Build Frontend Production Artifact (Vite)
        run: cd frontend && npm run build

      # 2. Backend Checks
      - name: Install Backend Dependencies
        run: cd backend && npm ci

      # 3. Automated Test Suite (Emergency Interception, Data Schemas, Privacy, API Contracts)
      - name: Execute Automated Regression Test Suite
        run: node --test tests/*.test.mjs
